zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 4abff66c37be497fb75bdce929c04e3e
      name: Templates/Applications
  templates:
    - uuid: 3a2d8d3f6a4f4d3e9b3a000000000002
      template: 'Template Public Pool API'
      name: 'Template Public Pool API'
      description: 'Monitors public-pool backend via HTTP API: /api/info, /api/network, /api/info/chart (no triggers). Includes pool hashrate and expected time-to-find-block (years) on one graph.'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000101
          name: 'Public Pool API: /api/info (raw)'
          type: HTTP_AGENT
          key: publicpool.api.info.raw
          history: 1d
          value_type: TEXT
          url: '{$API_URL}/api/info'
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000701
              expression: 'nodata(/Template Public Pool API/publicpool.api.info.raw,{$NODATA})=1'
              name: 'Public Pool API: /api/info unreachable or no data for {$NODATA}'
              priority: HIGH
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000103
          name: 'Public Pool API: /api/info/chart (raw)'
          type: HTTP_AGENT
          key: publicpool.api.infochart.raw
          delay: 10m
          history: 1d
          value_type: TEXT
          url: '{$API_URL}/api/info/chart'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000102
          name: 'Public Pool API: /api/network (raw)'
          type: HTTP_AGENT
          key: publicpool.api.network.raw
          delay: 5m
          history: 1d
          value_type: TEXT
          url: '{$API_URL}/api/network'
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000702
              expression: 'nodata(/Template Public Pool API/publicpool.api.network.raw,{$NODATA})=1'
              name: 'Public Pool API: /api/network unreachable or no data for {$NODATA}'
              priority: WARNING
              dependencies:
                - name: 'Public Pool API: /api/info unreachable or no data for {$NODATA}'
                  expression: 'nodata(/Template Public Pool API/publicpool.api.info.raw,{$NODATA})=1'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000602
          name: 'Expected time to find block (days)'
          type: CALCULATED
          key: publicpool.expected_time.days
          history: 30d
          value_type: FLOAT
          units: d
          params: 'last(//publicpool.network.difficulty)*4294967296/(last(//publicpool.infochart.latest.phs)*1e15)/86400'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000601
          name: 'Expected time to find block (years)'
          type: CALCULATED
          key: publicpool.expected_time.years
          history: 30d
          value_type: FLOAT
          units: 'y'
          params: 'last(//publicpool.network.difficulty)*4294967296/(last(//publicpool.infochart.latest.phs)*1e15)/31557600'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000009901
          name: 'Hashrate flat threshold (H/s)'
          type: CALCULATED
          key: publicpool.hashrate.flat.threshold
          history: 30d
          value_type: FLOAT
          units: H/s
          params: 'max(avg(//publicpool.infochart.latest.value,2h)*{$HASHRATE_FLAT_THRESHOLD_REL},{$HASHRATE_FLAT_THRESHOLD_ABS})'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000202
          name: 'Pool: total hashrate (sum userAgents[].totalHashRate)'
          type: DEPENDENT
          key: publicpool.hashrate.total
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var sum = 0;
                  (j.userAgents || []).forEach(function(x){ sum += Number(x.totalHashRate || 0); });
                  return sum;
          master_item:
            key: publicpool.api.info.raw
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000706
              expression: 'count(/Template Public Pool API/publicpool.hashrate.total,10m)>=5 and avg(/Template Public Pool API/publicpool.hashrate.total,5m)<avg(/Template Public Pool API/publicpool.hashrate.total,{$DROP_BASELINE_WINDOW})*(100-{$HASHRATE_DROP_THRESHOLD_PCT})/100'
              name: 'Pool: total hashrate dropped >{$HASHRATE_DROP_THRESHOLD_PCT}% vs {$DROP_BASELINE_WINDOW} average'
              priority: INFO
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000204
          name: 'Pool: highscores latest updatedAt (epoch, max over array)'
          type: DEPENDENT
          key: publicpool.highscores.latest.ts
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var maxTs = 0;
                  (j.highScores || []).forEach(function(x){
                    var s = (x.updatedAt || "").trim();
                    if (!s) return;
                    var iso = s.replace(" ", "T") + "Z";
                    var ts = Date.parse(iso);
                    if (!isNaN(ts)) {
                      ts = Math.floor(ts/1000);
                      if (ts > maxTs) maxTs = ts;
                    }
                  });
                  return maxTs || null;
          master_item:
            key: publicpool.api.info.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000403
          name: 'Public-Pool Hashrate (PH/s)'
          type: DEPENDENT
          key: publicpool.infochart.latest.phs
          history: 30d
          value_type: FLOAT
          units: PH/s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  if (!a.length) return null;
                  var hs = Number(a[a.length-1].data);
                  if (!isFinite(hs)) return null;
                  return hs / 1e15;
          master_item:
            key: publicpool.api.infochart.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000402
          name: 'Chart: latest timestamp (epoch, last[].label)'
          type: DEPENDENT
          key: publicpool.infochart.latest.ts
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  if (!a.length) return null;
                  return Math.floor(Date.parse(a[a.length-1].label) / 1000);
          master_item:
            key: publicpool.api.infochart.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000401
          name: 'Chart: latest value (H/s)'
          type: DEPENDENT
          key: publicpool.infochart.latest.value
          history: 30d
          value_type: FLOAT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  return a.length ? Number(a[a.length-1].data) : null;
          master_item:
            key: publicpool.api.infochart.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000201
          name: 'Pool: total miners (sum userAgents[].count)'
          type: DEPENDENT
          key: publicpool.miners.total
          history: 7d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var sum = 0;
                  (j.userAgents || []).forEach(function(x){ sum += Number(x.count || 0); });
                  return sum;
          master_item:
            key: publicpool.api.info.raw
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000705
              expression: 'avg(/Template Public Pool API/publicpool.miners.total,2h)>20 and count(/Template Public Pool API/publicpool.miners.total,10m)>=5 and avg(/Template Public Pool API/publicpool.miners.total,5m)<avg(/Template Public Pool API/publicpool.miners.total,2h)*0.4'
              name: 'Pool: total miners collapsed (>60% drop vs 2h average)'
              priority: HIGH
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000704
              expression: 'count(/Template Public Pool API/publicpool.miners.total,10m)>=5 and avg(/Template Public Pool API/publicpool.miners.total,5m)<avg(/Template Public Pool API/publicpool.miners.total,{$DROP_BASELINE_WINDOW})*(100-{$MINERS_DROP_THRESHOLD_PCT})/100'
              name: 'Pool: total miners dropped >{$MINERS_DROP_THRESHOLD_PCT}% vs {$DROP_BASELINE_WINDOW} average'
              priority: WARNING
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000301
          name: 'Network: blocks'
          type: DEPENDENT
          key: publicpool.network.blocks
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.blocks
          master_item:
            key: publicpool.api.network.raw
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000711
              expression: 'max(/Template Public Pool API/publicpool.network.blocks,2h)=min(/Template Public Pool API/publicpool.network.blocks,2h)'
              name: 'Bitcoin node: block height not advancing for 2h'
              priority: HIGH
              dependencies:
                - name: 'Public Pool API: /api/network unreachable or no data for {$NODATA}'
                  expression: 'nodata(/Template Public Pool API/publicpool.api.network.raw,{$NODATA})=1'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000305
          name: 'Network: chain'
          type: DEPENDENT
          key: publicpool.network.chain
          history: 30d
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.chain
          master_item:
            key: publicpool.api.network.raw
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000709
              expression: 'last(/Template Public Pool API/publicpool.network.chain)<>"{$CHAIN_EXPECTED}"'
              name: 'Bitcoin network: chain mismatch'
              priority: DISASTER
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000302
          name: 'Network: difficulty'
          type: DEPENDENT
          key: publicpool.network.difficulty
          history: 30d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.difficulty
          master_item:
            key: publicpool.api.network.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000303
          name: 'Network: networkhashps'
          type: DEPENDENT
          key: publicpool.network.hashps
          history: 30d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.networkhashps
          master_item:
            key: publicpool.api.network.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000304
          name: 'Network: pooledtx'
          type: DEPENDENT
          key: publicpool.network.pooledtx
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.pooledtx
          master_item:
            key: publicpool.api.network.raw
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000306
          name: 'Network: warnings count'
          type: DEPENDENT
          key: publicpool.network.warnings.count
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.warnings.length()
          master_item:
            key: publicpool.api.network.raw
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000710
              expression: 'last(/Template Public Pool API/publicpool.network.warnings.count)>0'
              name: 'Bitcoin node: warnings present'
              priority: WARNING
              dependencies:
                - name: 'Public Pool API: /api/network unreachable or no data for {$NODATA}'
                  expression: 'nodata(/Template Public Pool API/publicpool.api.network.raw,{$NODATA})=1'
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000203
          name: 'Pool: uptime start (epoch)'
          type: DEPENDENT
          key: publicpool.uptime.start.ts
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var ts = Date.parse(j.uptime);
                  if (isNaN(ts)) return null;
                  return Math.floor(ts / 1000);
          master_item:
            key: publicpool.api.info.raw
          triggers:
            - uuid: 3a2d8d3f6a4f4d3e9b3a000000000708
              expression: '(now() - last(/Template Public Pool API/publicpool.uptime.start.ts))<600'
              name: 'Pool backend restarted within last 10m'
              priority: INFO
      discovery_rules:
        - uuid: fd0e0164ca5045fe85b8f6bb11156dfc
          name: 'User agent discovery'
          type: DEPENDENT
          key: publicpool.useragent.discovery
          description: 'Discovers every userAgent returned by /api/info and creates per-user-agent miner count, hashrate and best-difficulty items.'
          item_prototypes:
            - uuid: e5d8a9b553e643fc900115f6cc755cd4
              name: 'User agent {#UA}: connected miners'
              type: DEPENDENT
              key: 'publicpool.useragent.miners[{#UAKEY}]'
              history: 7d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var j = JSON.parse(value);
                      var ua = {#UA_JSON};
                      var list = j.userAgents || [];
                      for (var i = 0; i < list.length; i++) {
                          if (String(list[i].userAgent) === ua) {
                              return Number(list[i].count || 0);
                          }
                      }
                      return 0;
              master_item:
                key: publicpool.api.info.raw
            - uuid: e70124da2839406b8641c7c7cc3cd393
              name: 'User agent {#UA}: hashrate'
              type: DEPENDENT
              key: 'publicpool.useragent.hashrate[{#UAKEY}]'
              history: 7d
              value_type: FLOAT
              units: H/s
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var j = JSON.parse(value);
                      var ua = {#UA_JSON};
                      var list = j.userAgents || [];
                      for (var i = 0; i < list.length; i++) {
                          if (String(list[i].userAgent) === ua) {
                              return Number(list[i].totalHashRate || 0);
                          }
                      }
                      return 0;
              master_item:
                key: publicpool.api.info.raw
            - uuid: 8e500b1527744a9db7133b0e64e35985
              name: 'User agent {#UA}: best difficulty'
              type: DEPENDENT
              key: 'publicpool.useragent.best_difficulty[{#UAKEY}]'
              history: 30d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var j = JSON.parse(value);
                      var ua = {#UA_JSON};
                      var list = j.userAgents || [];
                      for (var i = 0; i < list.length; i++) {
                          if (String(list[i].userAgent) === ua) {
                              return Number(list[i].bestDifficulty || 0);
                          }
                      }
                      return 0;
              master_item:
                key: publicpool.api.info.raw
          master_item:
            key: publicpool.api.info.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var result = [];
                  var list = j.userAgents || [];

                  for (var i = 0; i < list.length; i++) {
                      if (list[i].userAgent === null || list[i].userAgent === undefined) {
                          continue;
                      }

                      var ua = String(list[i].userAgent);
                      if (ua.length === 0) {
                          continue;
                      }

                      // Item keys use a hex-encoded identifier so arbitrary user-agent
                      // characters do not make the generated Zabbix item key invalid.
                      var key = '';
                      for (var n = 0; n < ua.length; n++) {
                          var hex = ua.charCodeAt(n).toString(16);
                          key += ('0000' + hex).slice(-4);
                      }

                      result.push({
                          '{#UA}': ua,
                          '{#UAKEY}': key,
                          // A JSON string literal is safe to substitute directly into the
                          // JavaScript preprocessing of dependent item prototypes.
                          '{#UA_JSON}': JSON.stringify(ua)
                      });
                  }

                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      macros:
        - macro: '{$API_URL}'
          value: 'http://localhost:3334'
        - macro: '{$CHAIN_EXPECTED}'
          value: main
        - macro: '{$HASHRATE_FLAT_THRESHOLD_ABS}'
          value: '100000000'
        - macro: '{$HASHRATE_FLAT_THRESHOLD_REL}'
          value: '0.03'
        - macro: '{$NODATA}'
          value: 10m
        - macro: '{$MINERS_DROP_THRESHOLD_PCT}'
          value: '30'
        - macro: '{$HASHRATE_DROP_THRESHOLD_PCT}'
          value: '5'
        - macro: '{$DROP_BASELINE_WINDOW}'
          value: 2h
  graphs:
    - uuid: 3a2d8d3f6a4f4d3e9b3a000000000502
      name: 'Public-Pool Hashrate + Expected Time'
      graph_items:
        - color: 1A7C11
          item:
            host: 'Template Public Pool API'
            key: publicpool.infochart.latest.phs
        - sortorder: '1'
          color: 0040FF
          yaxisside: RIGHT
          item:
            host: 'Template Public Pool API'
            key: publicpool.expected_time.years
