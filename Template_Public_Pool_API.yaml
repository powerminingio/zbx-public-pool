zabbix_export:
  version: "7.4"

  template_groups:
    - uuid: 3a2d8d3f6a4f4d3e9b3a000000000001
      name: "Templates/Applications"

  templates:
    - uuid: 3a2d8d3f6a4f4d3e9b3a000000000002
      template: "Template Public Pool API"
      name: "Template Public Pool API"
      description: "Monitors public-pool backend via HTTP API: /api/info, /api/network, /api/info/chart (no triggers)."
      groups:
        - name: "Templates/Applications"

      macros:
        - macro: "{$API_URL}"
          value: "http://localhost:3334"

      items:
        # =============================
        # MASTER ITEMS (HTTP agent)
        # =============================
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000101
          name: "Public Pool API: /api/info (raw)"
          type: HTTP_AGENT
          key: publicpool.api.info.raw
          url: "{$API_URL}/api/info"
          request_method: GET
          value_type: TEXT
          history: 1d
          trends: "0"
          delay: 1m

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000102
          name: "Public Pool API: /api/network (raw)"
          type: HTTP_AGENT
          key: publicpool.api.network.raw
          url: "{$API_URL}/api/network"
          request_method: GET
          value_type: TEXT
          history: 1d
          trends: "0"
          delay: 5m

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000103
          name: "Public Pool API: /api/info/chart (raw)"
          type: HTTP_AGENT
          key: publicpool.api.infochart.raw
          url: "{$API_URL}/api/info/chart"
          request_method: GET
          value_type: TEXT
          history: 1d
          trends: "0"
          delay: 10m

        # =============================
        # DEPENDENT ITEMS from /api/info
        # =============================
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000201
          name: "Pool: total miners (sum userAgents[].count)"
          type: DEPENDENT
          key: publicpool.miners.total
          master_item:
            key: publicpool.api.info.raw
          value_type: UNSIGNED
          history: 7d
          trends: 365d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var sum = 0;
                  (j.userAgents || []).forEach(function(x){ sum += Number(x.count || 0); });
                  return sum;

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000202
          name: "Pool: total hashrate (sum userAgents[].totalHashRate)"
          type: DEPENDENT
          key: publicpool.hashrate.total
          master_item:
            key: publicpool.api.info.raw
          value_type: FLOAT
          history: 7d
          trends: 365d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var sum = 0;
                  (j.userAgents || []).forEach(function(x){ sum += Number(x.totalHashRate || 0); });
                  return sum;

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000203
          name: "Pool: uptime start (epoch)"
          type: DEPENDENT
          key: publicpool.uptime.start.ts
          master_item:
            key: publicpool.api.info.raw
          value_type: UNSIGNED
          history: 30d
          trends: 365d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var ts = Date.parse(j.uptime);
                  if (isNaN(ts)) return null;
                  return Math.floor(ts / 1000);

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000204
          name: "Pool: highscores latest updatedAt (epoch, max over array)"
          type: DEPENDENT
          key: publicpool.highscores.latest.ts
          master_item:
            key: publicpool.api.info.raw
          value_type: UNSIGNED
          history: 30d
          trends: 365d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  var maxTs = 0;
                  (j.highScores || []).forEach(function(x){
                    var s = (x.updatedAt || "").trim(); // "YYYY-MM-DD HH:MM:SS"
                    if (!s) return;
                    var iso = s.replace(" ", "T") + "Z"; // treat as UTC
                    var ts = Date.parse(iso);
                    if (!isNaN(ts)) {
                      ts = Math.floor(ts/1000);
                      if (ts > maxTs) maxTs = ts;
                    }
                  });
                  return maxTs || null;

        # =============================
        # DEPENDENT ITEMS from /api/network
        # =============================
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000301
          name: "Network: blocks"
          type: DEPENDENT
          key: publicpool.network.blocks
          master_item:
            key: publicpool.api.network.raw
          value_type: UNSIGNED
          history: 30d
          trends: 365d
          preprocessing:
            - type: JSONPATH
              parameters: [ "$.blocks" ]

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000302
          name: "Network: difficulty"
          type: DEPENDENT
          key: publicpool.network.difficulty
          master_item:
            key: publicpool.api.network.raw
          value_type: FLOAT
          history: 30d
          trends: 365d
          preprocessing:
            - type: JSONPATH
              parameters: [ "$.difficulty" ]

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000303
          name: "Network: networkhashps"
          type: DEPENDENT
          key: publicpool.network.hashps
          master_item:
            key: publicpool.api.network.raw
          value_type: FLOAT
          history: 30d
          trends: 365d
          preprocessing:
            - type: JSONPATH
              parameters: [ "$.networkhashps" ]

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000304
          name: "Network: pooledtx"
          type: DEPENDENT
          key: publicpool.network.pooledtx
          master_item:
            key: publicpool.api.network.raw
          value_type: UNSIGNED
          history: 30d
          trends: 365d
          preprocessing:
            - type: JSONPATH
              parameters: [ "$.pooledtx" ]

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000305
          name: "Network: chain"
          type: DEPENDENT
          key: publicpool.network.chain
          master_item:
            key: publicpool.api.network.raw
          value_type: TEXT
          history: 30d
          trends: "0"
          preprocessing:
            - type: JSONPATH
              parameters: [ "$.chain" ]

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000306
          name: "Network: warnings count"
          type: DEPENDENT
          key: publicpool.network.warnings.count
          master_item:
            key: publicpool.api.network.raw
          value_type: UNSIGNED
          history: 30d
          trends: 365d
          preprocessing:
            - type: JSONPATH
              parameters: [ "$.warnings.length()" ]

        # =============================
        # DEPENDENT ITEMS from /api/info/chart
        # =============================
        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000401
          name: "Chart: latest value (last[].data)"
          type: DEPENDENT
          key: publicpool.infochart.latest.value
          master_item:
            key: publicpool.api.infochart.raw
          value_type: FLOAT
          history: 30d
          trends: 365d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  return a.length ? Number(a[a.length-1].data) : null;

        - uuid: 3a2d8d3f6a4f4d3e9b3a000000000402
          name: "Chart: latest timestamp (epoch, last[].label)"
          type: DEPENDENT
          key: publicpool.infochart.latest.ts
          master_item:
            key: publicpool.api.infochart.raw
          value_type: UNSIGNED
          history: 30d
          trends: 365d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  if (!a.length) return null;
                  return Math.floor(Date.parse(a[a.length-1].label) / 1000);

